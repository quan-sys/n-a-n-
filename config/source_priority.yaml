version: 1
description: Deterministic source priority and required-field rules for multi-source evidence reconciliation.
default_numeric_tolerance_pct: 0.01
default_source_priority:
  - hose
  - hnx
  - ssc
  - annual_report_pdf_manual
  - manual_xlsx
  - manual_csv
  - cafef
  - vietstock
  - vnstock
required_readiness:
  l0:
    datasets:
      - universe
      - company_profile
      - market_price
      - financial_statement_summary
      - disclosure_status
  step18:
    datasets:
      - universe
      - company_profile
      - market_price
      - financial_statement_summary
      - disclosure_status
  future_step19:
    datasets:
      - universe
      - company_profile
      - market_price
      - financial_statement_summary
      - disclosure_status
datasets:
  universe:
    key_columns:
      - ticker
    source_priority:
      - hose
      - hnx
      - manual_xlsx
      - manual_csv
      - vnstock
    evidence_fields:
      - ticker
      - exchange
      - company_name
      - listing_status
      - source
      - source_url
      - fetch_time
      - confidence_raw
    required_fields:
      l0:
        - ticker
        - exchange
        - company_name
        - listing_status
      step18:
        - ticker
        - exchange
        - company_name
        - listing_status
      future_step19:
        - ticker
        - exchange
        - company_name
        - listing_status

  company_profile:
