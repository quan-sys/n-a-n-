core_indicators:
  price:
    <<: &daily_market_indicator
      data_type: numeric
      frequency: daily
      source_dataset: market_price
      missing_data_handling: insufficient_data_if_missing
      stale_data_policy: daily_data_stale_after_7_days
      confidence_rules:
        - source_timestamp_required
        - quality_status_required
        - stale_data_reduces_confidence
      manual_review_triggers:
        - missing_required_field
        - stale_data
        - low_source_confidence
      notes: Metadata definition only. Step 17 does not fetch values, score cycles, score companies, or run valuation.
    indicator_id: price
    display_name: Price
    category: market_price
    description: Market close price reference.
    unit: VND
    required_fields: [ticker, date, close, source, fetch_time]
    applies_to_drivers: []
    applies_to_archetypes: []
    applies_to_micro_sectors: []
    calculation_hint: use_clean_close_field
    interpretation_hint: context_only_for_later_timing_and_liquidity_work
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  volume:
    <<: *daily_market_indicator
    indicator_id: volume
    display_name: Volume
    category: market_liquidity
    description: Shares traded during the market period.
    unit: shares
    required_fields: [ticker, date, volume, source, fetch_time]
    applies_to_drivers: [market_liquidity]
    applies_to_archetypes: [securities_broker]
    applies_to_micro_sectors: [securities_broker]
    calculation_hint: use_clean_volume_field
    interpretation_hint: low_or_missing_volume_reduces_liquidity_confidence
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  trading_value:
    <<: *daily_market_indicator
    indicator_id: trading_value
    display_name: Trading Value
    category: market_liquidity
    description: Traded value used for liquidity context.
    unit: VND
    required_fields: [ticker, date, trading_value, source, fetch_time]
    applies_to_drivers: [market_liquidity]
    applies_to_archetypes: [securities_broker]
    applies_to_micro_sectors: [securities_broker]
    calculation_hint: use_clean_trading_value_field
    interpretation_hint: weak_trading_value_reduces_confidence
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  market_cap:
    <<: *daily_market_indicator
    indicator_id: market_cap
    display_name: Market Cap
    category: market_price
    description: Market capitalization when available from clean or manually supplied market data.
    unit: VND
    required_fields: [ticker, date, market_cap, source, fetch_time]
    applies_to_drivers: []
    applies_to_archetypes: []
    applies_to_micro_sectors: []
    calculation_hint: use_clean_market_cap_when_available
    interpretation_hint: missing_market_cap_reduces_l0_and_later_confidence
    directionality: context_dependent
    higher_is_better: null
    data_availability: medium

  revenue:
    <<: &quarterly_financial_indicator
      data_type: numeric
      frequency: quarterly
      source_dataset: financial_statement_summary
      missing_data_handling: required_for_high_confidence
      stale_data_policy: quarterly_data_stale_after_120_days
      confidence_rules:
        - source_timestamp_required
        - quality_status_required
        - stale_financial_data_reduces_confidence
      manual_review_triggers:
        - missing_required_field
        - stale_data
        - low_source_confidence
      notes: Metadata definition only. Step 17 does not fetch values, score cycles, score companies, or run valuation.
    indicator_id: revenue
    display_name: Revenue
    category: financial_statement
    description: Reported revenue from clean financial statements.
    unit: VND
    required_fields: [ticker, period, revenue, source, fetch_time]
    applies_to_drivers: []
    applies_to_archetypes: [export_manufacturer, commodity_processor, consumer_defensive, cyclical_manufacturer]
    applies_to_micro_sectors: []
    calculation_hint: use_clean_revenue_field
    interpretation_hint: context_only_until_later_company_modules
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  net_profit:
    <<: *quarterly_financial_indicator
    indicator_id: net_profit
    display_name: Net Profit
    category: profitability
    description: Reported net profit from clean financial statements.
    unit: VND
    required_fields: [ticker, period, net_profit, source, fetch_time]
    applies_to_drivers: []
    applies_to_archetypes: [financial_bank, holding_company]
    applies_to_micro_sectors: []
    calculation_hint: use_clean_net_profit_field
    interpretation_hint: context_only_until_later_company_modules
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  gross_margin:
    <<: *quarterly_financial_indicator
    indicator_id: gross_margin
    display_name: Gross Margin
    category: profitability
    description: Gross margin derived only when clean revenue and gross profit exist.
    unit: percent
    required_fields: [ticker, period, revenue, gross_profit, source, fetch_time]
    applies_to_drivers: [input_cost, output_price, commodity_spread]
    applies_to_archetypes: [export_manufacturer, commodity_processor, consumer_defensive, cyclical_manufacturer]
    applies_to_micro_sectors: [textile_export, consumer_staples, construction_materials]
    calculation_hint: gross_profit_divided_by_revenue_when_available
    interpretation_hint: margin_pressure_requires_context_from_sector_and_inputs
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  operating_margin:
    <<: *quarterly_financial_indicator
    indicator_id: operating_margin
    display_name: Operating Margin
    category: profitability
    description: Operating margin derived only when clean revenue and operating profit exist.
    unit: percent
    required_fields: [ticker, period, revenue, operating_profit, source, fetch_time]
    applies_to_drivers: [input_cost, output_price]
    applies_to_archetypes: [export_manufacturer, commodity_processor, consumer_defensive, cyclical_manufacturer]
    applies_to_micro_sectors: []
    calculation_hint: operating_profit_divided_by_revenue_when_available
    interpretation_hint: margin_pressure_requires_later_context
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  operating_cash_flow:
    <<: *quarterly_financial_indicator
    indicator_id: operating_cash_flow
    display_name: Operating Cash Flow
    category: cash_flow
    description: Operating cash flow from clean financial statements.
    unit: VND
    required_fields: [ticker, period, operating_cash_flow, source, fetch_time]
    applies_to_drivers: [working_capital]
    applies_to_archetypes: [export_manufacturer, commodity_processor, real_estate_developer, utility_regulated, logistics_infrastructure, consumer_defensive]
    applies_to_micro_sectors: []
    calculation_hint: use_clean_operating_cash_flow_field
    interpretation_hint: weak_cash_flow_reduces_later_survival_confidence
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  debt:
    <<: *quarterly_financial_indicator
    indicator_id: debt
    display_name: Debt
    category: balance_sheet
    description: Short-term and long-term debt fields for later balance-sheet review.
    unit: VND
    required_fields: [ticker, period, short_term_debt, long_term_debt, source, fetch_time]
    applies_to_drivers: [bond_maturity, interest_rate, working_capital]
    applies_to_archetypes: [real_estate_developer, utility_regulated, holding_company]
    applies_to_micro_sectors: [residential_real_estate, holding_company]
    calculation_hint: sum_short_term_and_long_term_debt_when_needed_later
    interpretation_hint: debt_pressure_requires_later_survival_context
    directionality: higher_usually_riskier
    higher_is_better: false
    data_availability: high

  inventory:
    <<: *quarterly_financial_indicator
    indicator_id: inventory
    display_name: Inventory
    category: working_capital
    description: Inventory balance for later working-capital and sector context.
    unit: VND
    required_fields: [ticker, period, inventory, source, fetch_time]
    applies_to_drivers: [inventory_cycle, working_capital]
    applies_to_archetypes: [export_manufacturer, commodity_processor, real_estate_developer, consumer_defensive, cyclical_manufacturer]
    applies_to_micro_sectors: [textile_export, residential_real_estate, retail_distribution, construction_materials]
    calculation_hint: use_clean_inventory_field
    interpretation_hint: inventory_change_requires_sector_context
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  equity:
    <<: *quarterly_financial_indicator
    indicator_id: equity
    display_name: Equity
    category: balance_sheet
    description: Equity from clean financial statements.
    unit: VND
    required_fields: [ticker, period, equity, source, fetch_time]
    applies_to_drivers: []
    applies_to_archetypes: [financial_bank, holding_company]
    applies_to_micro_sectors: [commercial_bank, holding_company]
    calculation_hint: use_clean_equity_field
    interpretation_hint: negative_or_missing_equity_requires_manual_review_upstream
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  ROE:
    <<: *quarterly_financial_indicator
    indicator_id: ROE
    display_name: ROE
    category: profitability
    description: Return on equity if clean net profit and equity are available.
    unit: percent
    required_fields: [ticker, period, net_profit, equity, source, fetch_time]
    applies_to_drivers: []
    applies_to_archetypes: [financial_bank, holding_company]
    applies_to_micro_sectors: [commercial_bank, holding_company]
    calculation_hint: net_profit_divided_by_equity_when_available
    interpretation_hint: context_only_until_later_peer_group_analysis
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

  ROA:
    <<: *quarterly_financial_indicator
    indicator_id: ROA
    display_name: ROA
    category: profitability
    description: Return on assets if clean net profit and total assets are available.
    unit: percent
    required_fields: [ticker, period, net_profit, total_assets, source, fetch_time]
    applies_to_drivers: []
    applies_to_archetypes: [financial_bank]
    applies_to_micro_sectors: [commercial_bank]
    calculation_hint: net_profit_divided_by_total_assets_when_available
    interpretation_hint: context_only_until_later_peer_group_analysis
    directionality: context_dependent
    higher_is_better: null
    data_availability: high

archetype_indicators:
  export_manufacturer:
    usd_vnd_rate:
      <<: &macro_indicator
        data_type: numeric
        frequency: monthly_or_daily
        source_dataset: macro_vietnam
        missing_data_handling: reduce_confidence
        stale_data_policy: monthly_data_stale_after_45_days
        confidence_rules: [source_timestamp_required, quality_status_required]
        manual_review_triggers: [missing_required_field, stale_data, low_source_confidence]
        notes: Metadata definition only. Step 17 does not fetch values, score cycles, score companies, or run valuation.
      indicator_id: usd_vnd_rate
      display_name: USD/VND Rate
      category: fx
      description: Exchange-rate indicator for foreign-currency exposure.
      unit: VND_per_USD
      required_fields: [date, indicator, value, source, fetch_time]
      applies_to_drivers: [USD_VND]
      applies_to_archetypes: [export_manufacturer, commodity_processor]
      applies_to_micro_sectors: [textile_export, pangasius_export, shrimp_export, tire_manufacturing, galvanized_steel]
      calculation_hint: use_clean_or_manual_macro_series
      interpretation_hint: effect_depends_on_export_revenue_and_imported_inputs
      directionality: mixed
      higher_is_better: null
      data_availability: medium

    export_demand_index:
      <<: *macro_indicator
      indicator_id: export_demand_index
      display_name: Export Demand Index
      category: export_demand
      description: Export demand proxy from trade, PMI, or manually curated sector data.
      unit: index
      required_fields: [date, indicator, value, source, fetch_time]
      applies_to_drivers: [export_demand, US_demand, EU_demand, China_demand]
      applies_to_archetypes: [export_manufacturer]
      applies_to_micro_sectors: [textile_export, pangasius_export, shrimp_export, tire_manufacturing, galvanized_steel]
      calculation_hint: map_to_relevant_export_or_pmi_series_later
      interpretation_hint: weaker_demand_reduces_later_cycle_confidence
      directionality: higher_usually_positive_for_volume
      higher_is_better: true
      data_availability: medium

    order_trend:
      <<: &event_indicator
        data_type: qualitative
        frequency: event_driven
        source_dataset: sector_news
        missing_data_handling: optional_context_only
        stale_data_policy: manual_review_if_no_timestamp
        confidence_rules: [source_timestamp_required, evidence_required_for_qualitative_signal]
        manual_review_triggers: [missing_source, conflicting_commentary, low_source_confidence]
        notes: Metadata definition only. Qualitative signals require evidence before later modules use them.
      indicator_id: order_trend
      display_name: Order Trend
      category: export_demand
      description: Order-book or customer-order direction from evidence-backed commentary.
      unit: qualitative
      required_fields: [date, sector, headline, source, source_url, fetch_time]
      applies_to_drivers: [order_trend, customer_inventory_cycle]
      applies_to_archetypes: [export_manufacturer, cyclical_manufacturer]
      applies_to_micro_sectors: [textile_export, pangasius_export, shrimp_export, tire_manufacturing]
      calculation_hint: metadata_only_until_text_or_manual_evidence_pipeline_exists
      interpretation_hint: conflicting_or_unsourced_commentary_requires_manual_review
      directionality: context_dependent
      higher_is_better: null
      data_availability: medium
      requires_manual_input: true

    input_cost_index:
      <<: &commodity_indicator
        data_type: numeric
        frequency: weekly_or_monthly
        source_dataset: commodity_global
        missing_data_handling: reduce_confidence
        stale_data_policy: monthly_data_stale_after_45_days
        confidence_rules: [source_timestamp_required, quality_status_required]
        manual_review_triggers: [missing_required_field, stale_data, conflicting_sources]
        notes: Metadata definition only. Step 17 does not fetch values, score cycles, score companies, or run valuation.
      indicator_id: input_cost_index
      display_name: Input Cost Index
      category: input_cost
      description: Input-cost proxy when sector-specific commodities are not yet mapped.
      unit: index
      required_fields: [date, commodity, value, source, fetch_time]
      applies_to_drivers: [input_cost, raw_material_availability, labor_cost]
      applies_to_archetypes: [export_manufacturer, commodity_processor, consumer_defensive, cyclical_manufacturer]
      applies_to_micro_sectors: [textile_export, consumer_staples, retail_distribution, construction_materials]
      calculation_hint: map_relevant_input_series_later
      interpretation_hint: higher_input_cost_can_pressure_margin_if_pass_through_is_limited
      directionality: higher_usually_negative_for_margin
      higher_is_better: false
      data_availability: medium

    logistics_cost_index:
      <<: *event_indicator
      indicator_id: logistics_cost_index
      display_name: Logistics Cost Index
      category: logistics
      description: Logistics or freight cost proxy for exporters and logistics operators.
      data_type: numeric
      unit: index
      required_fields: [date, indicator, value, source, fetch_time]
      applies_to_drivers: [logistics_cost, freight_rate]
      applies_to_archetypes: [export_manufacturer, logistics_infrastructure, consumer_defensive]
      applies_to_micro_sectors: [textile_export, pangasius_export, shrimp_export, port_logistics, retail_distribution]
      calculation_hint: map_to_freight_or_logistics_cost_series_later
      interpretation_hint: higher_cost_can_reduce_margin_when_not_passed_through
      directionality: higher_usually_negative_for_margin
      higher_is_better: false
      data_availability: medium
      requires_manual_input: false

  commodity_processor:
    output_price_index:
      <<: *commodity_indicator
      indicator_id: output_price_index
      display_name: Output Price Index
      category: output_price
      description: Benchmark output price for processed commodity products.
      unit: index_or_price
      required_fields: [date, commodity, value, source, fetch_time]
      applies_to_drivers: [output_price]
      applies_to_archetypes: [commodity_processor, export_manufacturer, cyclical_manufacturer]
      applies_to_micro_sectors: [steel_integrated, galvanized_steel, natural_rubber, fertilizer, construction_materials]
      calculation_hint: select_sector_relevant_output_price_later
      interpretation_hint: output_price_effect_depends_on_input_cost_and_inventory
      directionality: context_dependent
      higher_is_better: null
      data_availability: medium

    commodity_spread:
      <<: *commodity_indicator
      indicator_id: commodity_spread
      display_name: Commodity Spread
      category: spread
      description: Spread between output price and key input costs.
      unit: price_spread
      required_fields: [date, output_price, input_cost, source, fetch_time]
      applies_to_drivers: [commodity_spread]
      applies_to_archetypes: [commodity_processor]
      applies_to_micro_sectors: [steel_integrated, galvanized_steel, fertilizer, natural_rubber]
      calculation_hint: output_price_minus_key_input_costs_later
      interpretation_hint: spread_compression_is_negative_for_processors
      directionality: higher_usually_positive_for_margin
      higher_is_better: true
      data_availability: medium

    end_demand_index:
      <<: *macro_indicator
      indicator_id: end_demand_index
      display_name: End Demand Index
      category: domestic_demand
      description: End-demand proxy for processors and manufacturers.
      unit: index
      required_fields: [date, indicator, value, source, fetch_time]
      applies_to_drivers: [construction_demand, consumer_demand, China_demand]
      applies_to_archetypes: [commodity_processor, cyclical_manufacturer]
      applies_to_micro_sectors: [steel_integrated, construction_materials, natural_rubber]
      calculation_hint: map_to_sector_relevant_demand_series_later
      interpretation_hint: weak_end_demand_reduces_later_cycle_confidence
      directionality: higher_usually_positive_for_volume
      higher_is_better: true
      data_availability: medium

    working_capital_change:
      <<: *quarterly_financial_indicator
      indicator_id: working_capital_change
      display_name: Working Capital Change
      category: working_capital
      description: Working-capital change using clean statement fields when available.
      unit: VND_or_percent
      required_fields: [ticker, period, inventory, operating_cash_flow, source, fetch_time]
      applies_to_drivers: [working_capital, inventory_cycle]
      applies_to_archetypes: [commodity_processor, export_manufacturer, consumer_defensive]
      applies_to_micro_sectors: [steel_integrated, galvanized_steel, retail_distribution]
      calculation_hint: derive_only_after_required_clean_fields_exist
      interpretation_hint: working_capital_pressure_reduces_later_confidence
      directionality: context_dependent
      higher_is_better: null
      data_availability: medium

  financial_bank:
    NIM:
      <<: *quarterly_financial_indicator
      indicator_id: NIM
      display_name: Net Interest Margin
      category: banking_credit
      description: Bank margin between earning asset yield and funding cost.
      unit: percent
      required_fields: [ticker, period, NIM, source, fetch_time]
      applies_to_drivers: [NIM]
      applies_to_archetypes: [financial_bank]
      applies_to_micro_sectors: [commercial_bank]
      calculation_hint: use_reported_bank_specific_field_when_available
      interpretation_hint: NIM_context_depends_on_rate_and_credit_cycle
      directionality: context_dependent
      higher_is_better: null
      data_availability: medium

    CASA:
      <<: *quarterly_financial_indicator
      indicator_id: CASA
      display_name: CASA Ratio
      category: banking_credit
      description: Low-cost deposit funding mix for banks.
      unit: percent
      required_fields: [ticker, period, CASA, source, fetch_time]
      applies_to_drivers: [CASA]
      applies_to_archetypes: [financial_bank]
      applies_to_micro_sectors: [commercial_bank]
      calculation_hint: use_reported_bank_specific_field_when_available
      interpretation_hint: stronger_low_cost_funding_can_support_margin_resilience
      directionality: higher_usually_positive
      higher_is_better: true
      data_availability: medium

    NPL:
      <<: *quarterly_financial_indicator
      indicator_id: NPL
      display_name: NPL Ratio
      category: banking_credit
      description: Non-performing loan ratio for banks.
      unit: percent
      required_fields: [ticker, period, NPL, source, fetch_time]
      applies_to_drivers: [NPL]
      applies_to_archetypes: [financial_bank]
      applies_to_micro_sectors: [commercial_bank]
      calculation_hint: use_reported_bank_specific_field_when_available
      interpretation_hint: higher_NPL_reduces_asset_quality_confidence
      directionality: higher_usually_negative
      higher_is_better: false
      data_availability: medium

    group_2_debt:
      <<: *quarterly_financial_indicator
      indicator_id: group_2_debt
      display_name: Group 2 Debt
      category: banking_credit
      description: Watch-list debt ratio or value for bank asset-quality review.
      unit: percent_or_VND
      required_fields: [ticker, period, group_2_debt, source, fetch_time]
      applies_to_drivers: [group_2_debt]
      applies_to_archetypes: [financial_bank]
      applies_to_micro_sectors: [commercial_bank]
      calculation_hint: use_reported_bank_specific_field_when_available
      interpretation_hint: rising_group_2_debt_requires_manual_review_if_material
      directionality: higher_usually_negative
      higher_is_better: false
      data_availability: medium

    provisioning:
      <<: *quarterly_financial_indicator
      indicator_id: provisioning
      display_name: Provisioning
      category: banking_credit
      description: Provision expense or reserve coverage for banks.
      unit: VND_or_percent
      required_fields: [ticker, period, provisioning, source, fetch_time]
      applies_to_drivers: [provisioning]
      applies_to_archetypes: [financial_bank]
      applies_to_micro_sectors: [commercial_bank]
      calculation_hint: use_reported_bank_specific_field_when_available
      interpretation_hint: interpretation_depends_on_asset_quality_and_coverage
      directionality: mixed
      higher_is_better: null
      data_availability: medium

    credit_growth:
      <<: *macro_indicator
      indicator_id: credit_growth
      display_name: Credit Growth
      category: banking_credit
      description: System, sector, or bank loan growth context.
      unit: percent
      required_fields: [date, indicator, value, source, fetch_time]
      applies_to_drivers: [credit_growth, loan_growth]
      applies_to_archetypes: [financial_bank, real_estate_developer]
      applies_to_micro_sectors: [commercial_bank, residential_real_estate, industrial_park]
      calculation_hint: map_to_system_or_bank_specific_credit_growth_later
      interpretation_hint: aggressive_growth_can_add_risk_without_asset_quality_context
      directionality: mixed
      higher_is_better: null
      data_availability: medium

  real_estate_developer:
    legal_status:
      <<: *event_indicator
      indicator_id: legal_status
      display_name: Legal Status
      category: real_estate_project
      description: Project legal approval or land-use status.
      unit: qualitative
      required_fields: [ticker, date, event_type, source, source_url, fetch_time]
      applies_to_drivers: [legal_status]
      applies_to_archetypes: [real_estate_developer]
      applies_to_micro_sectors: [residential_real_estate, industrial_park]
      calculation_hint: metadata_only_until_project_event_pipeline_exists
      interpretation_hint: unclear_project_legal_status_requires_manual_review
      directionality: context_dependent
      higher_is_better: null
      data_availability: low
      requires_manual_input: true

    presales:
      <<: *event_indicator
      indicator_id: presales
      display_name: Presales
      category: real_estate_project
      description: Presales value or units when disclosed.
      data_type: numeric_or_qualitative
      unit: VND_or_units
      required_fields: [ticker, date, event_type, source, source_url, fetch_time]
      applies_to_drivers: [presales]
      applies_to_archetypes: [real_estate_developer]
      applies_to_micro_sectors: [residential_real_estate]
      calculation_hint: use_project_specific_disclosures_or_manual_input_later
      interpretation_hint: presales_need_cash_collection_and_project_context
      directionality: context_dependent
      higher_is_better: null
      data_availability: low
      requires_manual_input: true

    bond_maturity:
      <<: *event_indicator
      indicator_id: bond_maturity
      display_name: Bond Maturity
      category: balance_sheet
      description: Near-term bond or debt maturity pressure.
      data_type: numeric_or_schedule
      unit: VND_by_period
