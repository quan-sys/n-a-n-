version: 1
description: Candidate data sources for the Vietnamese stock screening pipeline.
datasets:
  - dataset_name: universe
    description: Initial listed stock universe.
    required_for_stage:
      - real_data_ingestion
      - raw_to_clean
      - universe_builder
      - l0_filters
    production_required: true
    sources:
      - source_name: Vnstock
        source_type: python_package
        primary_or_backup: primary
        expected_fields:
          - ticker
          - exchange
          - company_name
          - listing_status
          - data_source
          - last_updated
        update_frequency: daily
        reliability_level: medium
        requires_api_key: false
        access_method: package
        output_dataset_schema: universe
        confidence_default: medium
        notes: Candidate package source for listed ticker universe if available.
        legal_or_terms_notes: Review package license and upstream data terms before production use.
      - source_name: HOSE
        source_type: official_exchange
        primary_or_backup: backup
        expected_fields:
          - ticker
          - exchange
          - company_name
          - listing_status
        update_frequency: daily
        reliability_level: high
        requires_api_key: false
        access_method: html_table
        output_dataset_schema: universe
        confidence_default: high
        notes: Candidate official exchange source for HOSE-listed companies.
        legal_or_terms_notes: Confirm permitted automated access and cite official exchange pages.
      - source_name: HNX_UPCOM
        source_type: official_exchange
        primary_or_backup: backup
        expected_fields:
          - ticker
          - exchange
          - company_name
          - listing_status
        update_frequency: daily
        reliability_level: high
        requires_api_key: false
        access_method: html_table
        output_dataset_schema: universe
        confidence_default: high
        notes: Candidate official exchange source for HNX and UPCoM universe data.
        legal_or_terms_notes: Confirm permitted automated access and cite official exchange pages.
      - source_name: Manual Universe CSV
        source_type: manual_file
        primary_or_backup: fallback
        expected_fields:
          - ticker
          - exchange
          - company_name
          - listing_status
          - data_source
          - last_updated
        update_frequency: manual
        reliability_level: medium
        requires_api_key: false
        access_method: manual_upload
        output_dataset_schema: universe
        confidence_default: medium
        notes: Manually provided real universe file fallback.
        legal_or_terms_notes: User must document source and collection date.

