    production_required: true
    sources:
      - source_name: Vnstock
        source_type: python_package
        primary_or_backup: primary
        expected_fields:
          - ticker
          - date
          - close
          - volume
          - trading_value
          - source
          - fetch_time
        update_frequency: daily
        reliability_level: medium
        requires_api_key: false
        access_method: package
        output_dataset_schema: market_price
        confidence_default: medium
        notes: Candidate package source for historical price and liquidity fields.
        legal_or_terms_notes: Review package license and upstream data terms before production use.
      - source_name: Exchange Price Data
        source_type: official_exchange
        primary_or_backup: backup
        expected_fields:
          - ticker
          - date
          - close
          - volume
          - trading_value
        update_frequency: daily
        reliability_level: high
        requires_api_key: false
        access_method: html_table
        output_dataset_schema: market_price
        confidence_default: high
        notes: Candidate official exchange source if accessible.
        legal_or_terms_notes: Confirm permitted automated access and cite official exchange pages.
      - source_name: Manual Market Price CSV
        source_type: manual_file
        primary_or_backup: fallback
        expected_fields:
