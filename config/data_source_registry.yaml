        output_dataset_schema: financial_statement_summary
        confidence_default: medium
        notes: Candidate secondary financial table source if legally and technically accessible.
        legal_or_terms_notes: Review site terms and robots policy before automated access.
      - source_name: Manual Financial Statement File
        source_type: manual_file
        primary_or_backup: fallback
