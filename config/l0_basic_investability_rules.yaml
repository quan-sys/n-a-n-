version: 1
description: >
  L0 Basic Investability Filter rules. This is a rule-based continuation
  screen, not a buy/sell signal. Thresholds are adjustable assumptions and must
  be reviewed before production use.

component_weights:
  liquidity_score: 0.25
  market_cap_score: 0.15
  data_coverage_score: 0.25
  disclosure_risk_score: 0.15
  financial_viability_score: 0.20

score_thresholds:
  investable_min_score: 75
  watch_only_min_score: 55
  reject_below_score: 35

confidence_rules:
  investable_allowed_confidence:
    - high
  low_confidence_score_below: 50
  medium_confidence_score_below: 75

input_scope:
  hard_reject_statuses:
    - L0_REJECT
  caution_statuses:
    - L0_MANUAL_REVIEW
    - INSUFFICIENT_DATA_FOR_L0

liquidity:
  min_valid_trading_days: 1
  avg_trading_value:
    excellent: 5000000000
    good: 1000000000
    minimum: 100000000
  avg_volume:
    excellent: 50000
    good: 10000
    minimum: 1000
  penalties:
    stale_or_low_quality: 20

market_cap:
  column: market_cap
  missing_score: 50
  excellent: 1000000000000
  adequate: 300000000000
  minimum: 100000000000
  very_small_status: L0_REJECT

data_coverage:
  required_groups:
    - company_profile
    - market_price
    - financial_statement_summary
    - disclosure_status
  points_per_group:
    company_profile: 25
    market_price: 25
    financial_statement_summary: 25
    disclosure_status: 25
  minimum_required_score: 75
  clean_disclosure_event_types:
    - NO_DISCLOSURE_EVENTS
    - CONFIRMED_CLEAN
  quality_issue_penalty: 15

disclosure_risk:
  clean_event_types:
    - NO_DISCLOSURE_EVENTS
    - CONFIRMED_CLEAN
  severity_scores:
    LOW: 90
    MEDIUM: 70
    HIGH: 25
    CRITICAL: 0
    UNKNOWN: 50
  high_severity_status: L0_MANUAL_REVIEW
  critical_severity_status: L0_REJECT
  critical_event_types:
    - TRADING_RESTRICTION
    - SUSPENSION
    - DELISTING_WARNING
    - AUDIT_WARNING

financial_viability:
  essential_fields:
    - equity
    - total_assets
    - total_liabilities
    - net_profit
    - operating_cash_flow
  negative_equity_status: L0_REJECT
  debt_to_equity_watch_above: 2.0
  debt_to_equity_manual_review_above: 3.0
  min_periods_for_persistent_checks: 3
  persistent_loss_periods: 3
  repeated_negative_ocf_periods: 3

manual_review_triggers:
  - DATA_CONFLICT
  - UNKNOWN_DISCLOSURE_STATUS
  - SUSPICIOUS_OUTLIER
  - LOW_DATA_CONFIDENCE
  - HIGH_SEVERITY_DISCLOSURE_RISK

reject_triggers:
  - FAILED_L0_TRASH_FILTER
  - NEGATIVE_EQUITY
  - CRITICAL_DISCLOSURE_RISK
  - VERY_SMALL_MARKET_CAP
