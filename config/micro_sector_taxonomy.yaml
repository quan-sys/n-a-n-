version: 1
description: Initial L1 micro-sector taxonomy for Vietnamese stock screening.

micro_sectors:
  steel_integrated:
    micro_sector: steel_integrated
    display_name: Integrated Steel
    allowed_archetypes:
      - commodity_processor
      - cyclical_manufacturer
    driver_hints:
      - HRC
      - iron_ore
      - coking_coal
      - construction_demand
    keyword_hints:
      - steel
      - hrc
      - billet
      - iron ore
      - integrated steel
    notes: Steel producers with upstream or integrated production exposure.

  galvanized_steel:
    micro_sector: galvanized_steel
    display_name: Galvanized Steel
    allowed_archetypes:
      - commodity_processor
      - export_manufacturer
    driver_hints:
      - HRC
      - export_demand
      - trade_defense
    keyword_hints:
      - galvanized
      - coated steel
      - steel sheet
      - corrugated steel
    notes: Coated or galvanized steel producers and exporters.

  natural_rubber:
    micro_sector: natural_rubber
    display_name: Natural Rubber
    allowed_archetypes:
      - commodity_processor
    driver_hints:
      - rubber_price
      - China_demand
      - oil_price
    keyword_hints:
      - natural rubber
      - rubber plantation
      - latex
      - rubber processing
    notes: Natural rubber plantation or processing exposure.

  tire_manufacturing:
    micro_sector: tire_manufacturing
    display_name: Tire Manufacturing
    allowed_archetypes:
      - export_manufacturer
      - cyclical_manufacturer
    driver_hints:
      - rubber_input_cost
      - tire_exports
      - auto_demand
    keyword_hints:
      - tire
      - tyre
      - radial
      - rubber tire
    notes: Tire manufacturers exposed to rubber inputs and auto demand.

  pangasius_export:
    micro_sector: pangasius_export
    display_name: Pangasius Export
    allowed_archetypes:
      - export_manufacturer
    driver_hints:
      - export_demand
      - pangasius_price
      - feed_cost
      - anti_dumping_tax
    keyword_hints:
      - pangasius
      - basa fish
      - seafood export
      - fish fillet
    notes: Pangasius exporters and processors.

  shrimp_export:
    micro_sector: shrimp_export
    display_name: Shrimp Export
    allowed_archetypes:
      - export_manufacturer
    driver_hints:
      - export_demand
      - shrimp_price
      - feed_cost
    keyword_hints:
      - shrimp
      - seafood export
      - frozen shrimp
    notes: Shrimp exporters and processors.

  textile_export:
