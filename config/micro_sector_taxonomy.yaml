    notes: Textile, garment, apparel, or yarn export businesses.

  residential_real_estate:
    micro_sector: residential_real_estate
    display_name: Residential Real Estate
    allowed_archetypes:
      - real_estate_developer
    driver_hints:
      - legal_status
      - mortgage_rate
      - presales
      - bond_maturity
    keyword_hints:
      - residential
      - apartment
      - housing
      - real estate developer
      - property developer
    notes: Residential property developers.

  industrial_park:
    micro_sector: industrial_park
    display_name: Industrial Park
    allowed_archetypes:
      - real_estate_developer
      - logistics_infrastructure
    driver_hints:
      - FDI
      - occupancy
      - land_lease
      - rental_price
    keyword_hints:
