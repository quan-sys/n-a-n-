      VNIndex_trend: down
    overheating_when:
      margin_lending: spike_up
      broker_market_activity: spike_up
    structural_risk_indicators: [margin_lending]
    anomaly_indicators: [VNIndex_trend, broker_market_activity]

  power_generation:
    key_indicators: [electricity_output, hydrology, coal_price, gas_price, PPA_regulatory_price]
    recovery_when:
      electricity_output: up
      hydrology: up
    distress_when:
      coal_price: up
      gas_price: up
      electricity_output: down
      hydrology: down
    overheating_when:
      electricity_output: spike_up
    structural_risk_indicators: [PPA_regulatory_price]
    anomaly_indicators: [hydrology, electricity_output]

  port_logistics:
    key_indicators: [container_volume, export_import_volume, freight_rate, logistics_cost]
    recovery_when:
      container_volume: up
      export_import_volume: up
      freight_rate: up
    distress_when:
      container_volume: down
      export_import_volume: down
      logistics_cost: up
    overheating_when:
      freight_rate: spike_up
    structural_risk_indicators: [logistics_cost]
    anomaly_indicators: [container_volume, freight_rate]

  oil_gas_upstream:
    key_indicators: [oil_price, production_volume]
    recovery_when:
      oil_price: up
      production_volume: up
    distress_when:
      oil_price: down
      production_volume: down
    overheating_when:
