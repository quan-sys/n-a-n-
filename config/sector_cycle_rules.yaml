    structural_risk_indicators: [debt_pressure]
    anomaly_indicators: [oil_price, drilling_activity]

  fertilizer:
    key_indicators: [fertilizer_price, fertilizer_spread, gas_price]
    recovery_when:
      fertilizer_price: up
      fertilizer_spread: up
    distress_when:
      fertilizer_spread: down
      gas_price: up
    overheating_when:
      fertilizer_price: spike_up
    structural_risk_indicators: [trade_defense_risk]
    anomaly_indicators: [fertilizer_price, fertilizer_spread]

  consumer_staples:
    key_indicators: [staples_demand, consumer_demand, gross_margin, input_cost_index]
    recovery_when:
      staples_demand: up
      consumer_demand: up
      gross_margin: up
    distress_when:
      staples_demand: down
      consumer_demand: down
      input_cost_index: up
      gross_margin: down
    overheating_when:
      staples_demand: spike_up
    structural_risk_indicators: [working_capital_change]
    anomaly_indicators: [gross_margin]

  retail_distribution:
    key_indicators: [retail_sales, consumer_demand, logistics_cost, inventory]
    recovery_when:
      retail_sales: up
      consumer_demand: up
    distress_when:
      retail_sales: down
      consumer_demand: down
      logistics_cost: up
      inventory: up
    overheating_when:
      retail_sales: spike_up
    structural_risk_indicators: [working_capital_change]
    anomaly_indicators: [retail_sales, inventory]

  construction_materials:
    key_indicators: [construction_demand, public_investment, input_cost_index, gross_margin]
    recovery_when:
      construction_demand: up
      public_investment: up
      gross_margin: up
    distress_when:
      construction_demand: down
      public_investment: down
      input_cost_index: up
      gross_margin: down
    overheating_when:
      construction_demand: spike_up
